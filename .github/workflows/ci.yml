name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests benchmarks scripts paper/scripts
      - name: Format check
        run: ruff format --check src tests benchmarks scripts paper/scripts
      - name: Type check
        run: mypy src/sarc_dq benchmarks scripts paper/scripts
      - name: Test
        run: pytest -q

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Regenerate the artifacts that read from committed paper/data (not the results
      # branches, which are not in this checkout), confirm the committed copies are not
      # stale, then check claim-consistency invariants. Deterministic; no API calls.
      - name: Regenerate status + macros
        run: |
          python scripts/experiment_status.py
          python paper/scripts/make_macros.py
      - name: Committed derived artifacts must be up to date
        run: git diff --exit-code EXPERIMENT_STATUS.md reports/experiment_status.json paper/generated/results.tex
      - name: Claim consistency
        run: python paper/scripts/check_claim_consistency.py
      # The Phase 0 pipeline must stay runnable end-to-end at $0 (mock arm), so a
      # broken harness is caught on every push without ever calling a paid API.
      - name: Phase 0 pipeline dry-run (mock agent, offline, $0)
        run: python -m benchmarks.phase0_smoke --out /tmp/smoke_ci.md --seeds 24
      # The full six-arm × taxonomy × rate matrix must run offline at $0, so every
      # arm and every corruption class is exercised on every push.
      - name: Harness matrix dry-run (all arms + classes, offline, $0)
        run: python -m benchmarks.harness_matrix --episodes 40 --out /tmp/matrix_ci.json
      # GIGO-Bench reference must not drift (Green SARC discipline).
      - name: GIGO-Bench verify against frozen reference
        run: make gigo-verify
      # The research-calibrated taxonomy artifacts must be regenerated, not hand-edited.
      - name: Taxonomy calibration up to date
        run: make calibrate-check
