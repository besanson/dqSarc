name: exp-h3-frontier

# Manually triggered LIVE experiment kit (H3 (Gating dominance)). Real Claude — costs money.
# Predictions are pre-registered in reports/prereg/h3-frontier.md (frozen before any run).
# Orchestration only; no experiment code, prompts, or config changed by this file.
# Results -> results/h3-frontier-live. Requires an ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Episodes per condition"
        required: true
        default: "100"
  push:
    tags:
      - "run-h3-frontier-*"

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verification gate (tag-triggered autonomous firing only)
        if: startsWith(github.ref, 'refs/tags/run-')
        run: |
          if ! grep -qhE "STATUS:.*PASS" reports/VERIFICATION-*.md 2>/dev/null; then
            echo "::error::no passing reports/VERIFICATION-*.md on the tagged commit"
            exit 1
          fi
          echo "verification gate passed"
      - name: Check ANTHROPIC_API_KEY secret is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is not set."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present."
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,live,gate]"
      - name: Seed resume from prior partial results (if any)
        run: |
          mkdir -p reports/exp
          git fetch origin "results/h3-frontier-live" --depth=1 2>/dev/null || true
          git show "origin/results/h3-frontier-live:reports/exp/h3-frontier_summary.json" \
            > "reports/exp/h3-frontier_summary.json" 2>/dev/null \
            && echo "resuming from prior partial results" \
            || echo "fresh run (no prior partial)"
      - name: Run experiment h3-frontier (LIVE)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          mkdir -p reports/exp
          python -m benchmarks.experiments --exp h3-frontier --arm live \
            --episodes "$EPISODES" --concurrency 8 --max-minutes 320 \
            --out reports/exp/h3-frontier_summary.json
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-h3-frontier-results
          path: reports/exp/
          if-no-files-found: error
      - name: Commit results to results/h3-frontier-live
        env:
          EPISODES: ${{ inputs.episodes }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B results/h3-frontier-live
          git add -f reports/exp/h3-frontier_summary.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "h3-frontier live results (${EPISODES} episodes, run ${RUN_ID})"
          git push --force origin results/h3-frontier-live
