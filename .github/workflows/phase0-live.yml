name: phase0-live

# Manually triggered live Phase 0 run (real Claude — costs money). This workflow
# ONLY orchestrates the existing live command; it changes no experiment code,
# prompts, or configuration. Requires an ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Number of episodes (100 corrupted + 100 clean per the protocol)"
        required: true
        default: "100"

permissions:
  contents: write # push the results commit to the results/phase0-live branch

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before installing anything, if the secret is absent.
      - name: Check ANTHROPIC_API_KEY secret is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is not set. Add it under" \
                 "Settings → Secrets and variables → Actions before running this workflow."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (with live extra)
        run: pip install -e ".[dev,live]"

      - name: Run Phase 0 live smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPISODES: ${{ inputs.episodes }}
        run: |
          python -m benchmarks.phase0_smoke \
            --arm live \
            --episodes "$EPISODES" \
            --out reports/SMOKE_TEST.md

      # Capture the full reports/ tree (report, summary JSON, per-episode logs)
      # even if a later step fails.
      - name: Upload reports/ as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-live-reports
          path: reports/
          if-no-files-found: error

      - name: Commit results to results/phase0-live branch
        env:
          EPISODES: ${{ inputs.episodes }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B results/phase0-live
          # SMOKE_TEST.md is tracked; the summary JSON and logs are git-ignored, so
          # force-add them explicitly.
          git add -f \
            reports/SMOKE_TEST.md \
            reports/SMOKE_TEST.summary.json \
            reports/logs/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Phase 0 live results (${EPISODES} episodes, run ${RUN_ID})"
          git push --force origin results/phase0-live
